name: EmuELEC gratuito experimental

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Liberar disco temporario
        shell: bash
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          docker image prune -af || true
          sudo apt-get clean
          df -h

      - name: Dependencias
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc make git unzip wget xz-utils libsdl2-dev libsdl2-mixer-dev libfreeimage-dev libfreetype6-dev libcurl4-openssl-dev rapidjson-dev libasound2-dev libgl1-mesa-dev libboost-all-dev cmake fonts-droid-fallback libvlc-dev libvlccore-dev vlc-bin texinfo premake4 golang libssl-dev curl patchelf xmlstarlet default-jre xsltproc libvpx-dev rdfind tzdata xfonts-utils lzop bc libncurses-dev zstd libparse-yapp-perl smpq device-tree-compiler
          sudo apt-get install -y gperf libxml-parser-perl patchutils

      - name: Obter fontes
        shell: bash
        run: |
          git clone --depth 1 --branch dev https://github.com/EmuELEC/EmuELEC.git source
          git -C source rev-parse HEAD > source-commit.txt
          test -d source/projects/Amlogic-ce/devices/Amlogic-ng

      - name: Corrigir download do GMP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source/packages/devel/gmp/sources
          curl -fL --retry 5 --retry-delay 5 --connect-timeout 30 \
            -o source/packages/devel/gmp/sources/gmp-6.2.1.tar.xz \
            https://ftp.gnu.org/gnu/gmp/gmp-6.2.1.tar.xz
          sed -i \
            's#https://gmplib.org/download/gmp/${PKG_NAME}-${PKG_VERSION}.tar.xz#https://ftp.gnu.org/gnu/gmp/${PKG_NAME}-${PKG_VERSION}.tar.xz#' \
            source/packages/devel/gmp/package.mk
          grep -n 'PKG_URL' source/packages/devel/gmp/package.mk

      - name: Remover ECWolf
        shell: bash
        run: |
          set -euo pipefail
          find source/packages source/projects -type d -name 'ecwolf' -print0 \
            | xargs -0 -r rm -rf
          grep -rlI -w 'ecwolf' source/packages source/projects 2>/dev/null \
            | xargs -r sed -Ei 's/\becwolf\b//g'
          grep -RInI -w 'ecwolf' source/packages source/projects 2>/dev/null || true

      - name: Pre-baixar u-boot-tools
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PWD"
          CACHE="$ROOT/source/build.EmuELEC-Amlogic-ng.aarch64-4/sources/u-boot"
          FILE="$CACHE/u-boot-2016.03.tar.bz2"
          mkdir -p "$CACHE"
          if [ ! -s "$FILE" ]; then
            curl -fL --connect-timeout 20 --retry 2 -o "$FILE" "https://u-boot.osuosl.org/pub/u-boot/u-boot-2016.03.tar.bz2" || curl -fL --connect-timeout 20 --retry 2 -o "$FILE" "https://ftp.denx.de/pub/u-boot/u-boot-2016.03.tar.bz2"
          fi
          expected=$(grep -oP '(?<=PKG_SHA256=")[^"]+' "$ROOT/source/projects/Amlogic-ce/packages/tools/u-boot-tools/package.mk")
          echo "$expected  $FILE" | sha256sum -c -

      - name: Compilar
        shell: bash
        run: |
          set -o pipefail
          df -h
          cd source
          PROJECT=Amlogic-ce DEVICE=Amlogic-ng ARCH=aarch64 DISTRO=EmuELEC make image 2>&1 | tee ../build.log

      - name: Preparar imagem e checksums
        shell: bash
        run: |
          mkdir -p dist
          shopt -s nullglob
          images=(source/target/*.img.gz)
          test "${#images[@]}" -gt 0
          cp "${images[@]}" dist/
          cp source-commit.txt dist/
          cd dist
          sha256sum -- *.img.gz > SHA256SUMS

      - name: Publicar imagem
        uses: actions/upload-artifact@v4
        with:
          name: emuelec-s905x2-image
          path: dist/
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

      - name: Publicar logs mesmo em falha
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            build.log
            source-commit.txt
            source/build.*/.threads/logs/**
          retention-days: 3
          if-no-files-found: warn
